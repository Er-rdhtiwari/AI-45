# watsonx configuration
WATSONX_URL: "https://us-south.ml.cloud.ibm.com"
WATSONX_API_VERSION: "2024-05-31"
WATSONX_MODEL_ID: "openai/gpt-oss-120b"
WATSONX_PROJECT_ID: "9ed3f7dc-2403-4d73-88bd-11ca1433b7fe"

# Model capacity
MODEL_CONTEXT_LIMIT_TOKENS: "131072"
CONTEXT_SAFETY_MARGIN_TOKENS: "8192"
DEFAULT_MAX_OUTPUT_TOKENS: "4096"
HARD_MAX_INPUT_TOKENS: "110000"

# Step 1: fresh request
FRESH_MAX_INPUT_TOKENS: "24000"
FRESH_MAX_OUTPUT_TOKENS: "4096"

# Step 2: normal follow-up request
FOLLOWUP_MAX_TOTAL_INPUT_TOKENS: "48000"
FOLLOWUP_MAX_OUTPUT_TOKENS: "4096"

# Step 3: final conclusion request
FINAL_MAX_TOTAL_INPUT_TOKENS: "64000"
FINAL_MAX_OUTPUT_TOKENS: "4096"

# Conversation-history management
HISTORY_SUMMARY_TRIGGER_TOKENS: "48000"
HISTORY_KEEP_RECENT_TURNS: "4"
ENABLE_HISTORY_SUMMARIZATION: "true"

# Application-level HTTP limits
HTTP_BODY_WARNING_BYTES: "524288"
HTTP_BODY_HARD_LIMIT_BYTES: "1048576"

# Chunking configuration
CHUNK_SIZE_TOKENS: "1024"
CHUNK_OVERLAP_TOKENS: "128"

# Generation behaviour
FRESH_REASONING_LEVEL: "medium"
FOLLOWUP_REASONING_LEVEL: "medium"
FINAL_REASONING_LEVEL: "high"