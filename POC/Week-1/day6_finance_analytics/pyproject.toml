[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "day6-finance-analytics"
version = "0.1.0"
description = "Interview-grade budget-versus-actual and expense exception analytics service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "SQLAlchemy>=2.0,<2.2",
  "pydantic>=2.10,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=7.0,<9.0",
  "scipy>=1.14,<2.0",
  "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: requires PostgreSQL and Redis",
]

[tool.ruff]
line-length = 100
target-version = "py311"
